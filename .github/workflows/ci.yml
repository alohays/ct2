name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

  repository-checks:
    name: repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run VAO self-verifier
        run: python3 bin/ct2-vao-self-verify --run-checks --json --repo .

      - name: Audit protocol surface
        run: python3 bin/ct2-protocol-audit .

      - name: Check whitespace errors
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              # Validate the full PR diff against its base.
              git diff --check "$PR_BASE_SHA" "$HEAD_SHA"
              ;;
            push)
              # Validate every commit in the push, not just the tip.
              # New-branch pushes report a zero SHA in github.event.before; fall
              # back to the tip's parent for those.
              if [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                git diff --check "${HEAD_SHA}^" "$HEAD_SHA"
              else
                git diff --check "$PUSH_BEFORE_SHA" "$HEAD_SHA"
              fi
              ;;
            *)
              # workflow_dispatch and other manual triggers: validate the tip
              # commit only — there is no meaningful range from the event.
              git diff --check "${HEAD_SHA}^" "$HEAD_SHA"
              ;;
          esac

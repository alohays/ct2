name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump to prepare"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Prepare and test without pushing a tag or GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare release commit
        run: python3 bin/ct2-release prepare "${{ inputs.bump }}"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run repository verifier
        run: python3 bin/ct2-vao-self-verify --run-checks --json --repo .

      - name: Run host cleanliness verifier when available
        run: |
          set -euo pipefail
          if [[ -x bin/ct2-trace-lint ]]; then
            bin/ct2-trace-lint --strict .
          fi

      - name: Publish tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          git push origin HEAD:main
          git tag -a "$tag" -m "CT2 ${version}"
          git push origin "$tag"
          awk -v heading="## [${version}] - " '
            index($0, heading) == 1 { emit=1; next }
            emit && /^## \[/ { exit }
            emit { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$tag" --title "CT2 ${version}" --notes-file release-notes.md

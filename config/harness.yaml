# CT2 Protocol Configuration
# Copy this file to .ct2/config/harness.yaml during ct2-init.
# All values here are project-overridable defaults.

circuit_breaker:
  max_review_rounds: 3          # Force escalation beyond this many rejection rounds
  max_ticket_duration_min: 120  # Maximum processing time for a single ticket (minutes)
  max_review_duration_min: 240  # Maximum wait in in-review before helm escalation
  max_duration_bounces: 3       # Escalate after this many duration bounces
  max_total_attempts: 9         # Escalate after this many lifetime duration attempts
  max_concurrent_worktrees: 1   # Maximum simultaneous git worktrees (serial by default)

forge:
  loop_interval_active_sec: 60    # Agent pacing hint when actively working a ticket
  loop_interval_idle_sec: 120     # Agent pacing hint when backlog is empty
  loop_interval_dormant_sec: 180  # No tickets anywhere. Kept short enough for
                                  # reasonable reaction latency without noisy loops.

# ── Verified Autonomy OS scorecard ───────────────────────────────────────────
scorecard:
  trust_ratio_min: 0.92
  evidence_coverage_min: 0.90
  lens_latency_p95_sec: 90
  min_done_sample: 20
  min_blocked_sample: 5

# ── Static role contracts ────────────────────────────────────────────────────
# Advisory defaults consumed by ct2-role-run/status/evals. Runtime-specific
# drivers may degrade, but the degradation must be visible in telemetry/status.
role_contracts:
  ct2-helm:
    model: default
    reasoning_effort: medium
    max_latency_sec: 300
    budget_usd: null
    personality: planner
  ct2-forge:
    model: default
    reasoning_effort: high
    max_latency_sec: 7200
    budget_usd: null
    personality: implementer
  ct2-lens-cc:
    model: default
    reasoning_effort: high
    max_latency_sec: 90
    budget_usd: null
    personality: independent-reviewer
  ct2-lens-cx:
    model: default
    reasoning_effort: high
    max_latency_sec: 90
    budget_usd: null
    personality: independent-reviewer
  ct2-helm-auto-cx:
    model: default
    reasoning_effort: medium
    max_latency_sec: 900
    budget_usd: null
    personality: autonomous-planner

# ── Git workflow ──────────────────────────────────────────────────────────────
# Flat keys (not nested) so existing regex-based YAML readers work unchanged.
# See spec/git-workflow.md for the full contract.
git_strategy: branch-per-ticket   # branch-per-ticket | direct-to-main | none
git_default_base: auto            # auto (detect from origin/HEAD) | explicit branch name
git_auto_merge_on_approval: false # true = reconciler squash-merges PR on dual-approval
git_merge_method: squash          # squash | merge | rebase
git_commit_trailer_style: none    # legacy alias; use trace_hygiene.commit_trailer_style
git_push_on_commit: true          # push after each commit (false = batch push at submit)

# Host-repo cleanliness defaults. Fresh projects hide CT2-specific strings from
# branch names, PR bodies, and commit conventions. Existing projects without this
# block retain legacy-branded behavior until their config is edited.
trace_hygiene:
  preset: clean                   # clean | legacy-branded
  branch_naming: title-slug       # title-slug | ticket-id | custom
  branch_prefix_pattern: "{type}/{title-slug}"
  commit_scope_style: minimal     # minimal | conventional | ticket-id
  commit_trailer_style: minimal   # minimal | refs | structured
  pr_body_footer: none            # none | minimal | branded
  pr_body_ticket_link: hidden-html # hidden-html | visible | none

# GitHub Issue mirror. Fresh projects can expose ticket state through GitHub
# Issues while keeping the CT2 ticket file authoritative. Existing project
# configs without this block keep mirroring disabled until edited or migrated.
github_integration:
  enabled: true
  issue_mirror: pr-and-issue      # off | pr-and-issue
  issue_labels_prefix: "ct2/"
  issue_create_on_seal: true
  pr_closes_issue: true
  fallback_mode: queue            # queue | skip
  graphql_token_env: GH_TOKEN

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CT2 tiny agent ticket railway</title>
  <desc id="desc">A playful CT2 README hero image with four cute agents guiding tickets from draft to done through a shared .ct2 filesystem hub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fff9"/>
      <stop offset="0.55" stop-color="#eff9ff"/>
      <stop offset="1" stop-color="#fff7f3"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22b8cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#193941" flood-opacity="0.14"/>
    </filter>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.2" fill="#24434c" opacity="0.08"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#24434c"/>
    </marker>
    <style>
      .title { font: 800 44px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d3d45; letter-spacing: 0; }
      .subtitle { font: 700 23px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3f626b; letter-spacing: 0; }
      .label { font: 800 25px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24434c; letter-spacing: 0; }
      .small { font: 700 17px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b6d76; letter-spacing: 0; }
      .tiny { font: 800 16px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #45656d; letter-spacing: 0; }
      .outline { stroke: #24434c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .box { fill: #ffffff; stroke: #24434c; stroke-width: 4; filter: url(#shadow); }
      .arrow { fill: none; stroke: #24434c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <path d="M-80 710 C240 615 425 740 735 630 S1165 525 1680 660" fill="none" stroke="#2dd4bf" stroke-width="42" opacity="0.18"/>
  <path d="M-80 260 C245 350 465 195 780 270 S1180 335 1680 230" fill="none" stroke="#38bdf8" stroke-width="36" opacity="0.18"/>

  <text x="86" y="96" class="title">CT2</text>
  <text x="86" y="134" class="subtitle">cute file-first orchestration for autonomous agents</text>

  <g transform="translate(540 105)" filter="url(#shadow)">
    <path d="M42 0 h438 a38 38 0 0 1 38 38 v190 a38 38 0 0 1 -38 38 H38 a38 38 0 0 1 -38 -38 V78 a38 38 0 0 1 38 -38 h168 l38 -40 z" fill="url(#hub)" stroke="#24434c" stroke-width="6"/>
    <rect x="68" y="92" width="382" height="86" rx="8" fill="#f8fffb" stroke="#24434c" stroke-width="5"/>
    <text x="194" y="146" class="title">.ct2/</text>
  </g>

  <g transform="translate(1125 115)">
    <rect x="0" y="0" width="330" height="118" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="5" filter="url(#shadow)"/>
    <text x="34" y="45" class="label">No shortcut to done.</text>
    <text x="34" y="78" class="small">Both reviewers approve first.</text>
  </g>

  <g transform="translate(155 235)">
    <circle cx="92" cy="92" r="78" fill="#ffd166" class="outline"/>
    <circle cx="64" cy="88" r="9" fill="#24434c"/>
    <circle cx="120" cy="88" r="9" fill="#24434c"/>
    <path d="M68 123 Q92 142 116 123" class="outline" fill="none"/>
    <rect x="48" y="154" width="90" height="48" rx="8" fill="#ffffff" class="outline"/>
    <path d="M65 174 h54 M65 190 h35" stroke="#8fa3aa" stroke-width="5" stroke-linecap="round"/>
    <rect x="21" y="205" width="142" height="38" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="3"/>
    <text x="48" y="230" class="tiny">ct2-helm</text>
  </g>

  <g transform="translate(652 615)">
    <circle cx="95" cy="78" r="74" fill="#7dd3fc" class="outline"/>
    <path d="M48 37 h94 l18 42 H30 z" fill="#34d399" class="outline"/>
    <circle cx="70" cy="81" r="8" fill="#24434c"/>
    <circle cx="124" cy="81" r="8" fill="#24434c"/>
    <path d="M75 113 Q96 130 117 113" class="outline" fill="none"/>
    <path d="M150 122 l56 40" class="outline"/>
    <rect x="205" y="151" width="60" height="24" rx="7" fill="#ffd166" class="outline" transform="rotate(31 205 151)"/>
    <rect x="42" y="164" width="106" height="38" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="3"/>
    <text x="67" y="189" class="tiny">forge</text>
  </g>

  <g transform="translate(950 255)">
    <circle cx="82" cy="82" r="72" fill="#b7f3d1" class="outline"/>
    <circle cx="58" cy="83" r="8" fill="#24434c"/>
    <circle cx="106" cy="83" r="8" fill="#24434c"/>
    <path d="M62 113 Q82 130 102 113" class="outline" fill="none"/>
    <circle cx="138" cy="140" r="33" fill="#ffffff" class="outline"/>
    <path d="M161 164 l42 42" class="outline"/>
    <rect x="26" y="178" width="112" height="36" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="3"/>
    <text x="48" y="202" class="tiny">lens-cc</text>
  </g>

  <g transform="translate(1160 255)">
    <circle cx="82" cy="82" r="72" fill="#ffc5b5" class="outline"/>
    <circle cx="58" cy="83" r="8" fill="#24434c"/>
    <circle cx="106" cy="83" r="8" fill="#24434c"/>
    <path d="M62 113 Q82 130 102 113" class="outline" fill="none"/>
    <circle cx="138" cy="140" r="33" fill="#ffffff" class="outline"/>
    <path d="M161 164 l42 42" class="outline"/>
    <rect x="26" y="178" width="112" height="36" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="3"/>
    <text x="48" y="202" class="tiny">lens-cx</text>
  </g>

  <g transform="translate(118 480)">
    <rect x="0" y="0" width="228" height="120" rx="8" class="box"/>
    <text x="76" y="48" class="label">draft</text>
    <rect x="70" y="70" width="88" height="34" rx="8" fill="#f8fffb" stroke="#24434c" stroke-width="4"/>
    <path d="M86 83 h56 M86 96 h38" stroke="#8fa3aa" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(433 480)">
    <rect x="0" y="0" width="238" height="120" rx="8" class="box"/>
    <text x="68" y="48" class="label">backlog</text>
    <rect x="75" y="70" width="88" height="34" rx="8" fill="#f8fffb" stroke="#24434c" stroke-width="4"/>
    <path d="M91 83 h56 M91 96 h38" stroke="#8fa3aa" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(756 480)">
    <rect x="0" y="0" width="238" height="120" rx="8" class="box"/>
    <text x="78" y="48" class="label">review</text>
    <rect x="75" y="70" width="88" height="34" rx="8" fill="#f8fffb" stroke="#24434c" stroke-width="4"/>
    <path d="M91 83 h56 M91 96 h38" stroke="#8fa3aa" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(1254 480)">
    <rect x="0" y="0" width="228" height="120" rx="8" class="box"/>
    <text x="82" y="48" class="label">done</text>
    <circle cx="114" cy="84" r="29" fill="#34d399" stroke="#24434c" stroke-width="5"/>
    <path d="M100 84 l11 12 l24 -30" stroke="#24434c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path class="arrow" d="M346 540 H416"/>
  <path class="arrow" d="M671 540 H739"/>
  <path class="arrow" d="M995 540 H1228"/>

  <g transform="translate(1025 492)">
    <rect x="0" y="0" width="164" height="86" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4" filter="url(#shadow)"/>
    <text x="36" y="32" class="tiny">two stamps</text>
    <circle cx="58" cy="58" r="17" fill="#b7f3d1" stroke="#24434c" stroke-width="4"/>
    <circle cx="108" cy="58" r="17" fill="#ffc5b5" stroke="#24434c" stroke-width="4"/>
    <path d="M50 58 l6 7 l13 -17 M100 58 l6 7 l13 -17" stroke="#24434c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(190 760)">
    <rect x="0" y="0" width="246" height="56" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="28" y="35" class="tiny">file = source of truth</text>
    <rect x="278" y="0" width="154" height="56" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="310" y="35" class="tiny">atomic mv</text>
    <rect x="464" y="0" width="216" height="56" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="493" y="35" class="tiny">sidecar verdicts</text>
    <rect x="712" y="0" width="184" height="56" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="743" y="35" class="tiny">zero git noise</text>
  </g>
</svg>

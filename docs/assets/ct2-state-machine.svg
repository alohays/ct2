<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">CT2 ticket state machine</title>
  <desc id="desc">A flat state machine diagram showing the CT2 ticket lifecycle, dual-review gate, rejected rework, escalation, and manual revise recovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#243238"/>
    </marker>
    <marker id="mutedArrow" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#778588"/>
    </marker>
    <style>
      .bg { fill: #f7f8f5; }
      .state { fill: #ffffff; stroke: #243238; stroke-width: 2.4; }
      .review { fill: #f3faf8; stroke: #243238; stroke-width: 2.4; }
      .gate { fill: #fff7e6; stroke: #8a6a26; stroke-width: 2.2; }
      .done { fill: #eaf6ef; stroke: #2e6c52; stroke-width: 2.2; }
      .reject { fill: #fff5df; stroke: #8a6a26; stroke-width: 2.2; }
      .esc { fill: #fff0ea; stroke: #8a4f40; stroke-width: 2.2; }
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #243238; letter-spacing: 0; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #5a696d; letter-spacing: 0; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #243238; letter-spacing: 0; }
      .small { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #5a696d; letter-spacing: 0; }
      .edge { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #5a696d; letter-spacing: 0; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #243238; letter-spacing: 0; }
      .line { fill: none; stroke: #243238; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .muted { fill: none; stroke: #778588; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#mutedArrow); }
      .dash { fill: none; stroke: #778588; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 8; marker-end: url(#mutedArrow); }
      .rule { stroke: #dce4e1; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="620"/>
  <text x="64" y="60" class="title">Ticket state is the directory</text>
  <text x="64" y="92" class="subtitle">Every automated transition is an atomic mv. Terminal success still requires both independent sidecars.</text>
  <line x1="64" y1="120" x2="1336" y2="120" class="rule"/>

  <g transform="translate(74 190)">
    <rect class="state" width="150" height="76" rx="8"/>
    <text x="47" y="32" class="label">draft/</text>
    <text x="31" y="54" class="small">helm authors</text>
  </g>
  <g transform="translate(274 190)">
    <rect class="state" width="160" height="76" rx="8"/>
    <text x="43" y="32" class="label">backlog/</text>
    <text x="35" y="54" class="small">sealed queue</text>
  </g>
  <g transform="translate(494 190)">
    <rect class="state" width="190" height="76" rx="8"/>
    <text x="28" y="32" class="label">in-progress/</text>
    <text x="39" y="54" class="small">forge owns patch</text>
  </g>
  <g transform="translate(744 190)">
    <rect class="review" width="170" height="76" rx="8"/>
    <text x="30" y="32" class="label">in-review/</text>
    <text x="24" y="54" class="small">sidecars pending</text>
  </g>
  <g transform="translate(974 178)">
    <path class="gate" d="M54 0 L108 54 L54 108 L0 54 Z"/>
    <text x="28" y="50" class="edge">AND</text>
    <text x="18" y="68" class="edge">reconcile</text>
  </g>
  <g transform="translate(1210 190)">
    <rect class="done" width="150" height="76" rx="8"/>
    <text x="48" y="32" class="label">done/</text>
    <text x="22" y="54" class="small">both approve</text>
  </g>

  <path class="line" d="M224 228 H256"/>
  <text x="226" y="178" class="edge">ct2-seal</text>
  <path class="line" d="M434 228 H474"/>
  <text x="442" y="178" class="edge">pickup</text>
  <path class="line" d="M684 228 H724"/>
  <text x="686" y="178" class="edge">all ACs checked</text>
  <path class="line" d="M914 228 H966"/>
  <text x="922" y="178" class="edge">two sidecars</text>
  <path class="line" d="M1082 232 H1190"/>
  <text x="1100" y="178" class="edge">cc AND cx approve</text>

  <g transform="translate(736 370)">
    <rect class="reject" width="178" height="72" rx="8"/>
    <text x="40" y="30" class="label">rejected/</text>
    <text x="28" y="52" class="small">any rejection</text>
  </g>
  <g transform="translate(984 370)">
    <rect class="esc" width="188" height="72" rx="8"/>
    <text x="32" y="30" class="label">escalated/</text>
    <text x="24" y="52" class="small">round limit</text>
  </g>

  <path class="dash" d="M1028 286 V334 H825 V354"/>
  <text x="830" y="344" class="edge">if any rejected</text>
  <path class="dash" d="M1028 286 V334 H1078 V354"/>
  <text x="1084" y="344" class="edge">if max rounds</text>
  <path class="dash" d="M736 406 H589 C560 406 536 382 536 350 V286"/>
  <text x="590" y="390" class="edge">rework: review-round++</text>

  <path class="muted" d="M590 190 C558 148 410 146 354 176"/>
  <text x="414" y="152" class="edge">duration circuit breaker -> backlog/</text>

  <path class="dash" d="M825 442 V512 H149 V286"/>
  <path class="dash" d="M1078 442 V512 H149 V286"/>
  <text x="198" y="500" class="edge">ct2-revise: archive sidecars, reset frontmatter, return to draft/</text>

  <g transform="translate(74 548)">
    <rect class="state" width="290" height="38" rx="8"/>
    <text x="22" y="25" class="mono">done/ has exactly one path</text>
  </g>
  <g transform="translate(396 548)">
    <rect class="state" width="310" height="38" rx="8"/>
    <text x="22" y="25" class="mono">review sidecars are immutable</text>
  </g>
  <g transform="translate(738 548)">
    <rect class="state" width="322" height="38" rx="8"/>
    <text x="22" y="25" class="mono">reconciler owns verdict fields</text>
  </g>
</svg>

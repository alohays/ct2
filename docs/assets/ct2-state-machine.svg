<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">CT2 ticket state machine</title>
  <desc id="desc">The CT2 ticket lifecycle: draft to backlog to in-progress to in-review, with approved, rejected, escalated, revise, and duration circuit breaker transitions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfa"/>
      <stop offset="1" stop-color="#f8f4ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#102c34" flood-opacity="0.13"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#193941" stroke-width="1" opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#193941"/>
    </marker>
    <style>
      .title { font: 800 44px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #193941; letter-spacing: 0; }
      .subtitle { font: 700 21px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486872; letter-spacing: 0; }
      .node { font: 800 24px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #193941; letter-spacing: 0; }
      .small { font: 700 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d6870; letter-spacing: 0; }
      .micro { font: 800 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d6870; letter-spacing: 0; }
      .box { fill: #ffffff; stroke: #193941; stroke-width: 4; filter: url(#shadow); }
      .arrow { fill: none; stroke: #193941; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .softarrow { fill: none; stroke: #486872; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <text x="72" y="72" class="title">Ticket State Machine</text>
  <text x="72" y="110" class="subtitle">file moves are the protocol; both reviews are required for done</text>

  <g transform="translate(96 246)">
    <rect x="0" y="0" width="174" height="94" rx="10" class="box"/>
    <text x="56" y="40" class="node">draft</text>
    <text x="42" y="66" class="small">helm WIP</text>
  </g>
  <g transform="translate(326 246)">
    <rect x="0" y="0" width="190" height="94" rx="10" class="box"/>
    <text x="48" y="40" class="node">backlog</text>
    <text x="34" y="66" class="small">sealed queue</text>
  </g>
  <g transform="translate(578 246)">
    <rect x="0" y="0" width="212" height="94" rx="10" class="box"/>
    <text x="36" y="40" class="node">in-progress</text>
    <text x="40" y="66" class="small">forge owns one</text>
  </g>
  <g transform="translate(856 246)">
    <rect x="0" y="0" width="190" height="94" rx="10" class="box"/>
    <text x="34" y="40" class="node">in-review</text>
    <text x="26" y="66" class="small">dual lenses scan</text>
  </g>
  <g transform="translate(1324 246)">
    <rect x="0" y="0" width="174" height="94" rx="10" fill="#eafff2" stroke="#193941" stroke-width="4" filter="url(#shadow)"/>
    <text x="58" y="40" class="node">done</text>
    <text x="32" y="66" class="small">both approve</text>
  </g>

  <path class="arrow" d="M270 293 H304"/>
  <text x="286" y="274" class="micro">ct2-seal</text>
  <path class="arrow" d="M516 293 H556"/>
  <text x="526" y="274" class="micro">pickup</text>
  <path class="arrow" d="M790 293 H834"/>
  <text x="792" y="274" class="micro">submit</text>
  <path class="arrow" d="M1046 293 H1302"/>
  <text x="1090" y="274" class="micro">cc approved AND cx approved</text>

  <g transform="translate(1088 182)">
    <rect x="0" y="0" width="96" height="44" rx="8" fill="#eafff2" stroke="#193941" stroke-width="3"/>
    <text x="23" y="29" class="micro">cc sidecar</text>
    <rect x="116" y="0" width="96" height="44" rx="8" fill="#fff1eb" stroke="#193941" stroke-width="3"/>
    <text x="139" y="29" class="micro">cx sidecar</text>
  </g>
  <path class="softarrow" d="M944 246 C980 204 1028 190 1082 204"/>
  <path class="softarrow" d="M1002 246 C1040 224 1086 214 1196 204"/>

  <g transform="translate(884 456)">
    <rect x="0" y="0" width="190" height="94" rx="10" fill="#fff4df" stroke="#193941" stroke-width="4" filter="url(#shadow)"/>
    <text x="44" y="40" class="node">rejected</text>
    <text x="26" y="66" class="small">any lens rejects</text>
  </g>
  <g transform="translate(1160 456)">
    <rect x="0" y="0" width="206" height="94" rx="10" fill="#fff1eb" stroke="#193941" stroke-width="4" filter="url(#shadow)"/>
    <text x="38" y="40" class="node">escalated</text>
    <text x="24" y="66" class="small">max rounds reached</text>
  </g>
  <g transform="translate(440 456)">
    <rect x="0" y="0" width="210" height="94" rx="10" fill="#f8fffc" stroke="#193941" stroke-width="4" filter="url(#shadow)"/>
    <text x="42" y="40" class="node">ct2-revise</text>
    <text x="34" y="66" class="small">archive and reset</text>
  </g>

  <path class="arrow" d="M945 340 C942 380 950 414 968 444"/>
  <text x="984" y="394" class="micro">rejected verdict</text>
  <path class="arrow" d="M1074 503 H1138"/>
  <text x="1084" y="484" class="micro">round limit</text>
  <path class="arrow" d="M884 504 C792 504 722 430 690 354"/>
  <text x="708" y="462" class="micro">rework increments round</text>
  <path class="arrow" d="M548 456 C430 410 276 394 184 354"/>
  <text x="254" y="426" class="micro">human-triggered reset to draft</text>
  <path class="softarrow" d="M1260 550 C1054 604 806 596 652 524"/>
  <text x="892" y="594" class="micro">ct2-revise after escalation</text>

  <path class="softarrow" d="M690 340 C620 392 510 394 430 350"/>
  <text x="480" y="400" class="micro">duration circuit breaker returns to backlog</text>

  <g transform="translate(144 612)">
    <rect x="0" y="0" width="258" height="50" rx="9" fill="#ffffff" stroke="#193941" stroke-width="3"/>
    <text x="37" y="32" class="small">atomic mv transitions</text>
    <rect x="304" y="0" width="258" height="50" rx="9" fill="#ffffff" stroke="#193941" stroke-width="3"/>
    <text x="348" y="32" class="small">state = directory</text>
    <rect x="608" y="0" width="280" height="50" rx="9" fill="#ffffff" stroke="#193941" stroke-width="3"/>
    <text x="647" y="32" class="small">immutable sidecars</text>
  </g>
</svg>

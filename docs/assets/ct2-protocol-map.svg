<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">CT2 protocol boundary map</title>
  <desc id="desc">A flat technical architecture diagram showing agent runtimes above CT2, MCP beside them as tool access, and the .ct2 filesystem ledger as the only source of truth.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#243238"/>
    </marker>
    <style>
      .bg { fill: #f7f8f5; }
      .band { fill: #ffffff; stroke: #ccd6d3; stroke-width: 2; }
      .runtime { fill: #f8f6ef; stroke: #a29367; stroke-width: 2; }
      .protocol { fill: #f2faf7; stroke: #243238; stroke-width: 2.8; }
      .ledger { fill: #ffffff; stroke: #243238; stroke-width: 2.4; }
      .mcp { fill: #f3f6fb; stroke: #8398b2; stroke-width: 2; }
      .gate { fill: #fff7e6; stroke: #8a6a26; stroke-width: 2; }
      .done { fill: #eaf6ef; stroke: #2e6c52; stroke-width: 2; }
      .bad { fill: #fff0ea; stroke: #8a4f40; stroke-width: 2; }
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 36px; font-weight: 700; fill: #243238; letter-spacing: 0; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #5a696d; letter-spacing: 0; }
      .section { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #6c7a7d; letter-spacing: 0; text-transform: uppercase; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #243238; letter-spacing: 0; }
      .small { font-family: Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #5a696d; letter-spacing: 0; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #243238; letter-spacing: 0; }
      .line { fill: none; stroke: #243238; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .muted { fill: none; stroke: #7d8b8e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); stroke-dasharray: 6 7; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="780"/>
  <text x="64" y="66" class="title">Protocol Boundary</text>
  <text x="64" y="98" class="subtitle">CT2 standardizes the file-backed workflow contract. It does not own the model, loop, UI, scheduler, or tool layer.</text>

  <text x="74" y="148" class="section">runtime layer</text>
  <rect class="band" x="64" y="168" width="1272" height="130" rx="10"/>
  <g transform="translate(92 204)">
    <rect class="runtime" width="220" height="60" rx="8"/>
    <text x="28" y="26" class="label">Claude Code</text>
    <text x="28" y="45" class="small">session, /goal, hooks</text>
  </g>
  <g transform="translate(340 204)">
    <rect class="runtime" width="220" height="60" rx="8"/>
    <text x="28" y="26" class="label">Codex CLI</text>
    <text x="28" y="45" class="small">goals, plugins, app server</text>
  </g>
  <g transform="translate(588 204)">
    <rect class="runtime" width="220" height="60" rx="8"/>
    <text x="28" y="26" class="label">OpenCode</text>
    <text x="28" y="45" class="small">provider-agnostic agent</text>
  </g>
  <g transform="translate(836 204)">
    <rect class="runtime" width="220" height="60" rx="8"/>
    <text x="28" y="26" class="label">Cursor / Copilot</text>
    <text x="28" y="45" class="small">background execution</text>
  </g>
  <g transform="translate(1084 204)">
    <rect class="mcp" width="220" height="60" rx="8"/>
    <text x="28" y="26" class="label">MCP servers</text>
    <text x="28" y="45" class="small">tools and context only</text>
  </g>

  <path class="line" d="M202 298 V344"/>
  <path class="line" d="M450 298 V344"/>
  <path class="line" d="M698 298 V344"/>
  <path class="line" d="M946 298 V344"/>
  <path class="muted" d="M1194 298 V344"/>

  <text x="74" y="338" class="section">ct2 protocol layer</text>
  <rect class="protocol" x="64" y="358" width="1272" height="186" rx="10"/>
  <g transform="translate(100 396)">
    <rect class="ledger" width="236" height="110" rx="8"/>
    <text x="24" y="32" class="label">Role adapters</text>
    <text x="24" y="58" class="mono">adapter markdown</text>
    <text x="24" y="82" class="small">Prompt + invocation</text>
  </g>
  <g transform="translate(386 396)">
    <rect class="ledger" width="236" height="110" rx="8"/>
    <text x="24" y="32" class="label">One-shot tools</text>
    <text x="24" y="58" class="mono">seal / reconcile / status</text>
    <text x="24" y="82" class="small">No CT2 event loop</text>
  </g>
  <g transform="translate(672 396)">
    <rect class="ledger" width="236" height="110" rx="8"/>
    <text x="24" y="32" class="label">Review protocol</text>
    <text x="24" y="58" class="mono">cc AND cx sidecars</text>
    <text x="24" y="82" class="small">Independent until reconcile</text>
  </g>
  <g transform="translate(958 396)">
    <rect class="ledger" width="236" height="110" rx="8"/>
    <text x="24" y="32" class="label">Conformance</text>
    <text x="24" y="58" class="mono">fixtures -> adapters</text>
    <text x="24" y="82" class="small">Spec first, code second</text>
  </g>

  <path class="line" d="M704 544 V590"/>
  <text x="74" y="588" class="section">source of truth</text>
  <rect class="band" x="64" y="608" width="1272" height="112" rx="10"/>
  <g transform="translate(100 636)">
    <rect class="ledger" width="244" height="54" rx="8"/>
    <text x="24" y="34" class="mono">.ct2/{state}/{ticket}.md</text>
  </g>
  <g transform="translate(378 636)">
    <rect class="ledger" width="244" height="54" rx="8"/>
    <text x="24" y="34" class="mono">.ct2/reviews/*-rN.md</text>
  </g>
  <g transform="translate(656 636)">
    <rect class="gate" width="244" height="54" rx="8"/>
    <text x="24" y="34" class="mono">reconciler AND gate</text>
  </g>
  <g transform="translate(934 636)">
    <rect class="done" width="160" height="54" rx="8"/>
    <text x="38" y="34" class="mono">done/</text>
    <rect class="bad" x="184" y="0" width="160" height="54" rx="8"/>
    <text x="212" y="34" class="mono">rejected/</text>
  </g>
  <path class="line" d="M344 662 H370"/>
  <path class="line" d="M622 662 H648"/>
  <path class="line" d="M900 662 H926"/>

  <text x="64" y="756" class="small">Boundary rule: runtime metadata may be mirrored under .ct2/runtime/, but only ticket files, sidecars, and ct2-reconcile decide terminal state.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CT2 simplified architecture map</title>
  <desc id="desc">A simplified README diagram showing CT2 as a file-first loop: plan tickets, move through the shared .ct2 filesystem, build, review independently, then reconcile to done, rejected, or escalated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fff9"/>
      <stop offset="0.55" stop-color="#eff9ff"/>
      <stop offset="1" stop-color="#fff8f2"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="review" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#193941" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#24434c" stroke-width="1" opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#24434c"/>
    </marker>
    <style>
      .title { font: 800 48px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #193941; letter-spacing: 0; }
      .subtitle { font: 700 22px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #45656d; letter-spacing: 0; }
      .node { font: 800 28px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #193941; letter-spacing: 0; }
      .small { font: 700 17px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4c6972; letter-spacing: 0; }
      .badge { font: 800 20px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24434c; letter-spacing: 0; }
      .box { fill: #ffffff; stroke: #24434c; stroke-width: 4; filter: url(#shadow); }
      .arrow { fill: none; stroke: #24434c; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #45656d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M-80 700 C230 590 470 730 760 615 S1185 520 1680 660" fill="none" stroke="#2dd4bf" stroke-width="44" opacity="0.17"/>
  <path d="M-80 250 C230 335 475 205 760 270 S1165 330 1680 225" fill="none" stroke="#38bdf8" stroke-width="38" opacity="0.16"/>

  <text x="82" y="94" class="title">CT2 Architecture Map</text>
  <text x="82" y="132" class="subtitle">file-first coordination with independent review gates</text>

  <g transform="translate(92 270)">
    <rect x="0" y="0" width="230" height="116" rx="8" class="box"/>
    <text x="68" y="48" class="node">Plan</text>
    <text x="53" y="78" class="small">ct2-helm</text>
  </g>

  <g transform="translate(462 210)" filter="url(#shadow)">
    <path d="M44 0 h426 a38 38 0 0 1 38 38 v210 a38 38 0 0 1 -38 38 H38 a38 38 0 0 1 -38 -38 V78 a38 38 0 0 1 38 -38 h164 l38 -40 z" fill="url(#hub)" stroke="#24434c" stroke-width="6"/>
    <rect x="70" y="95" width="370" height="94" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="5"/>
    <text x="174" y="135" class="node">.ct2/</text>
    <text x="117" y="164" class="small">filesystem source of truth</text>
  </g>

  <g transform="translate(1110 270)">
    <rect x="0" y="0" width="230" height="116" rx="8" class="box"/>
    <text x="62" y="48" class="node">Build</text>
    <text x="57" y="78" class="small">ct2-forge</text>
  </g>

  <path class="arrow" d="M322 328 H440"/>
  <path class="arrow" d="M972 328 H1088"/>

  <g transform="translate(430 520)">
    <rect x="0" y="0" width="308" height="148" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4" filter="url(#shadow)"/>
    <text x="42" y="48" class="node">Ticket states</text>
    <text x="43" y="82" class="small">draft -> backlog -> review</text>
    <text x="43" y="112" class="small">moved with atomic mv</text>
  </g>

  <g transform="translate(862 500)">
    <rect x="0" y="0" width="350" height="188" rx="8" fill="url(#review)" stroke="#24434c" stroke-width="4" filter="url(#shadow)"/>
    <text x="63" y="48" class="node">Dual review</text>
    <rect x="54" y="78" width="110" height="48" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="75" y="109" class="badge">lens-cc</text>
    <rect x="188" y="78" width="110" height="48" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="209" y="109" class="badge">lens-cx</text>
    <text x="78" y="156" class="small">immutable sidecars</text>
  </g>

  <path class="thin" d="M646 496 V412"/>
  <path class="thin" d="M1038 496 C982 455 905 435 805 410"/>

  <g transform="translate(628 735)">
    <rect x="0" y="0" width="344" height="82" rx="8" class="box"/>
    <text x="98" y="35" class="node">Reconcile</text>
    <text x="72" y="62" class="small">approved, rejected, escalated</text>
  </g>

  <path class="arrow" d="M584 668 C608 694 655 712 720 730"/>
  <path class="arrow" d="M1037 688 C1006 708 955 722 882 733"/>

  <g transform="translate(120 740)">
    <rect x="0" y="0" width="154" height="56" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="31" y="36" class="badge">atomic mv</text>
    <rect x="184" y="0" width="178" height="56" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="214" y="36" class="badge">no database</text>
    <rect x="392" y="0" width="166" height="56" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="420" y="36" class="badge">zero git</text>
  </g>

  <g transform="translate(1054 740)">
    <rect x="0" y="0" width="174" height="56" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="30" y="36" class="badge">two approvals</text>
    <rect x="204" y="0" width="138" height="56" rx="8" fill="#ffffff" stroke="#24434c" stroke-width="4"/>
    <text x="236" y="36" class="badge">stdlib</text>
  </g>
</svg>
